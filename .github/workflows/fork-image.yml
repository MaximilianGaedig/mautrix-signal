# Fork CI: keeps main merged with upstream and publishes the image that
# la-casa runs (watchtower pulls :latest). Sync and build live in one
# workflow because pushes made with GITHUB_TOKEN don't trigger other workflows.
name: Fork image

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: fork-image
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: merge
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/mautrix/${REPO#mautrix-}.git"
          git fetch upstream main
          before=$(git rev-parse HEAD)
          echo "behind=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_OUTPUT"
          if git merge --no-edit upstream/main; then
            # Fails if upstream changed .github/workflows (GITHUB_TOKEN can't push those);
            # merge that one by hand.
            git push origin HEAD:main
            echo conflicted=false >> "$GITHUB_OUTPUT"
            if [ "$before" != "$(git rev-parse HEAD)" ]; then echo changed=true >> "$GITHUB_OUTPUT"; else echo changed=false >> "$GITHUB_OUTPUT"; fi
          else
            # The conflict markers stay in the tree: this branch exists to show what disagreed,
            # which --abort would throw away. Nothing is published, so the running image is
            # whatever last built cleanly.
            echo conflicted=true >> "$GITHUB_OUTPUT"
            echo changed=false >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request for a sync that needs a human
        if: steps.merge.outputs.conflicted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: ${{ steps.merge.outputs.files }}
          BEHIND: ${{ steps.merge.outputs.behind }}
        run: |
          # One branch per day, so a sync that keeps conflicting updates its own branch rather
          # than opening four pull requests a day.
          BRANCH="sync-upstream/$(date -u +%Y-%m-%d)"
          # Commit the conflicted merge where we stand, then push HEAD at the branch. Not a checkout:
          # git refuses to switch branches with an unresolved index, which is exactly the state this
          # step runs in, so a checkout here fails precisely when it is needed.
          git add -A
          git commit -m "Merge upstream main (conflicts left for review)" --no-edit || true
          # Asked already today, so somebody may be resolving that branch: leave it alone rather than
          # pushing over their work.
          if [ -n "$(gh pr list --head "$BRANCH" --json number --jq '.[].number')" ]; then
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            printf '%s\n\n' "The scheduled sync could not merge upstream cleanly, $BEHIND commits behind."
            printf '%s\n\n' "The conflict markers are left in this branch on purpose, so what disagreed is visible."
            printf '%s\n' "Conflicted files:"
            printf '\n```\n%s\n```\n\n' "$FILES"
            printf '%s\n' "Until this lands, no new image is published and la-casa keeps running the last clean build."
            printf '%s\n' "If it will not build after the conflicts are resolved, check mautrix-go: this is a fork chain, and the missing piece is often a sync owed one repository down."
          } > /tmp/pr-body.md
          gh pr create --base main --head "$BRANCH" --title "Sync upstream main" --body-file /tmp/pr-body.md

  build:
    needs: sync
    if: >-
      always() && needs.sync.result != 'failure' &&
      (github.event_name != 'schedule' || needs.sync.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
