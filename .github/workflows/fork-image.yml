# Fork CI: keeps main merged with upstream and publishes the image that
# la-casa runs (watchtower pulls :latest). Sync and build live in one
# workflow because pushes made with GITHUB_TOKEN don't trigger other workflows.
name: Fork image

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: fork-image
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: merge
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/mautrix/${REPO#mautrix-}.git"
          git fetch upstream main
          before=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          # Fails if upstream changed .github/workflows (GITHUB_TOKEN can't push those);
          # merge that one by hand.
          git push origin HEAD:main
          if [ "$before" != "$(git rev-parse HEAD)" ]; then echo changed=true >> "$GITHUB_OUTPUT"; else echo changed=false >> "$GITHUB_OUTPUT"; fi

  build:
    needs: sync
    if: >-
      always() && needs.sync.result != 'failure' &&
      (github.event_name != 'schedule' || needs.sync.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
